# CI : lance les tests automatiquement sur GitHub à chaque push et à chaque pull request.
# Résultat visible dans l'onglet « Actions » du repo (✅ ou ❌ à côté de chaque commit).
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances (versions exactes du package-lock.json)
        run: npm ci

      - name: Lancer les tests
        run: npm test
